<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">TripMaker</title>
  <desc id="desc">A sunset sky with a dotted route linking colorful member pins, under the TripMaker wordmark and the tagline: everyone's wishes, one plan, nobody left behind.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff" opacity="0.7">
      <circle cx="90" cy="48" r="1.6"/><circle cx="210" cy="92" r="1.2"/><circle cx="340" cy="36" r="1.8"/>
      <circle cx="610" cy="58" r="1.3"/><circle cx="780" cy="30" r="1.6"/><circle cx="905" cy="84" r="1.2"/>
      <circle cx="1040" cy="44" r="1.8"/><circle cx="1150" cy="100" r="1.3"/><circle cx="470" cy="104" r="1.1"/>
    </g>

    <!-- sun -->
    <circle cx="960" cy="330" r="170" fill="url(#sun)"/>
    <circle cx="960" cy="330" r="70" fill="#fde68a" opacity="0.95"/>

    <!-- hills -->
    <path d="M0 340 C 160 290 300 300 440 330 S 760 290 900 320 S 1120 300 1200 310 V420 H0Z" fill="#4c1d95" opacity="0.85"/>
    <path d="M0 370 C 200 340 380 360 560 372 S 900 340 1200 360 V420 H0Z" fill="#2e1065"/>

    <!-- route -->
    <path d="M70 352 C 190 300 250 380 360 330 S 520 250 640 300 S 820 380 930 300 S 1080 250 1140 270"
          fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.9"/>

    <!-- member pins -->
    <g stroke="#fff" stroke-width="3">
      <circle cx="70" cy="352" r="11" fill="#f43f5e"/>
      <circle cx="360" cy="330" r="11" fill="#22c55e"/>
      <circle cx="640" cy="300" r="11" fill="#38bdf8"/>
      <circle cx="930" cy="300" r="11" fill="#facc15"/>
      <circle cx="1140" cy="270" r="11" fill="#e879f9"/>
    </g>

    <!-- plane -->
    <g transform="translate(1062 196) rotate(-18)" fill="#fff">
      <path d="M0 0 L46 0 C54 0 58 4 58 6 C58 8 54 12 46 12 L0 12 L-6 6Z"/>
      <path d="M20 4 L8 -20 L16 -20 L34 4Z"/>
      <path d="M20 8 L8 32 L16 32 L34 8Z"/>
      <path d="M-2 4 L-10 -8 L-4 -8 L6 4Z"/>
    </g>
    <path d="M1000 232 C 1020 220 1040 214 1056 206" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 9" opacity="0.7"/>

    <!-- wordmark -->
    <text x="70" y="168" fill="#fff"
          font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="104" font-weight="800" letter-spacing="-3">TripMaker</text>
    <text x="74" y="222" fill="#fde68a"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="30" font-weight="600">Everyone's wishes. One plan. Nobody left behind.</text>
  </g>
</svg>
